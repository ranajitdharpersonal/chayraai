steps:
  # ==========================================================
  # 1. BUILD
  # ==========================================================
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/chayra-ai-swarm:$COMMIT_SHA'
      - '.'

  # ==========================================================
  # 2. PUSH
  # ==========================================================
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/chayra-ai-swarm:$COMMIT_SHA'

  # ==========================================================
  # 3. DEPLOY PUBLIC APPLICATION
  # ==========================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'chayra-ai-service'
      - '--image'
      - 'gcr.io/$PROJECT_ID/chayra-ai-swarm:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--service-account'
      - 'chayra-ai-core@daring-chess-470414-g1.iam.gserviceaccount.com'
      - '--update-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=asia-south1,MODEL_ARMOR_LOCATION=us-central1,MODEL_ARMOR_TEMPLATE_ID=default'

  # ==========================================================
  # 4. DEPLOY PRIVATE AUTONOMOUS RUNTIME
  # ==========================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'chayra-ai-runtime'
      - '--image'
      - 'gcr.io/$PROJECT_ID/chayra-ai-swarm:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--no-allow-unauthenticated'
      - '--service-account'
      - 'chayra-ai-core@daring-chess-470414-g1.iam.gserviceaccount.com'
      - '--update-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=asia-south1,MODEL_ARMOR_LOCATION=us-central1,MODEL_ARMOR_TEMPLATE_ID=default'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '1'
      - '--concurrency'
      - '1'

images:
  - 'gcr.io/$PROJECT_ID/chayra-ai-swarm:$COMMIT_SHA'